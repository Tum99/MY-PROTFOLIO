<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith Tum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <header class="masthead">
    <p class="wordmark">Hello,<br>I'm Faith Tum</p>
    <p class="tagline"><span>Full-Stack</span> Web Developer</p>
  </header>

  <main class="wheel-section">
    <div class="wheel-wrap" id="wheel">
      <div class="grooves" aria-hidden="true"></div>
      <div class="sheen" aria-hidden="true"></div>

      <!-- Center Disc -->
      <div class="disc" aria-hidden="true">
        <div class="disc-avatar-wrap">
          <img src="/static/images/hero-img.png" alt="Faith Tum" class="disc-avatar" onerror="this.style.display='none'; document.getElementById('discFallback').style.display='flex';">
          <div class="disc-avatar-fallback" id="discFallback">FT</div>
        </div>
      </div>
      <!-- Items dynamically injected by JS -->
    </div>
  </main>

  <footer class="site-footer"></footer>

  <!-- modal overlay -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="overlay-panel" id="panel">
      <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
      
      <div class="panel-top" id="panelTop">
        <h2 id="dTitle">PROJECTS</h2>
        <p class="sub" id="dSub">These are the projects i have been working on</p>
      </div>

      <div class="panel-body">
        <div class="portfolio-carousel-nav">
          <button class="nav-arrow" id="prevBtn" aria-label="Previous item">&lt;</button>
          <span class="counter" id="itemCounter">1/2</span>
          <button class="nav-arrow" id="nextBtn" aria-label="Next item">&gt;</button>
        </div>

        <div class="portfolio-display">
          <h3 class="feature-title" id="dFeatureTitle">CAFFEIN &amp; CHAOS</h3>
          
          <div class="feature-image-wrapper">
            <img src="" alt="Feature Graphic" id="dFeatureImage" class="feature-image" onerror="this.style.display='none'">
            <div id="dFallbackGraphic" class="fallback-graphic-box">🌿</div>
          </div>

          <p class="feature-description" id="dBlurb"></p>
          
          <div class="metadata-stack" id="dMetadataStack">
            <!-- Programmatically handled key-value descriptors inside here -->
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
